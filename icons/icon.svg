<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TypeTalk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="keyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Key shadow -->
  <rect x="104" y="156" width="304" height="232" rx="44" fill="#000000" opacity="0.18"/>
  <!-- Keyboard key -->
  <rect x="104" y="136" width="304" height="232" rx="44" fill="url(#keyShade)"/>
  <!-- Key top face -->
  <rect x="124" y="156" width="264" height="180" rx="30" fill="#ffffff"/>
  <!-- Sound wave bars -->
  <g fill="#3b6cf6">
    <rect x="166" y="222" width="22" height="48" rx="11"/>
    <rect x="208" y="196" width="22" height="100" rx="11"/>
    <rect x="250" y="172" width="22" height="148" rx="11"/>
    <rect x="292" y="196" width="22" height="100" rx="11"/>
    <rect x="334" y="222" width="22" height="48" rx="11"/>
  </g>
  <!-- Speech tail -->
  <path d="M152 368 L152 428 L222 368 Z" fill="#ffffff"/>
</svg>
