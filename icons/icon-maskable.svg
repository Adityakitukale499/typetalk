<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TypeTalk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="keyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
  </defs>
  <!-- Solid full-bleed background (no rounding; the OS applies its own mask) -->
  <rect width="512" height="512" fill="#3b6cf6"/>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Artwork scaled to ~66% and centred to stay inside the maskable safe zone -->
